<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker $100K</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f2; color: #1a1a18; min-height: 100vh; padding: 16px 14px 50px; max-width: 560px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
.subtitle { font-size: 12px; color: #999; margin-bottom: 18px; }
.sdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: #ccc; vertical-align: middle; }
.sdot.ok { background: #1a9e6e; } .sdot.err { background: #e04040; } .sdot.sync { background: #f0a500; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.met { background: #fff; border: 1px solid #e8e8e6; border-radius: 10px; padding: 12px 14px; }
.met-label { font-size: 11px; color: #888; margin-bottom: 4px; }
.met-val { font-size: 22px; font-weight: 700; }
.met-sub { font-size: 11px; color: #bbb; margin-top: 2px; }
.blue { color: #1a5fa8; } .teal { color: #0d7a56; } .green { color: #2d7a1f; }
.bars-card, .chart-card, .card { background: #fff; border: 1px solid #e8e8e6; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.bar-row { margin-bottom: 13px; } .bar-row:last-child { margin-bottom: 0; }
.bar-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.bar-title { font-weight: 600; } .bar-count { color: #888; font-size: 12px; }
.bar-bg { width: 100%; height: 20px; background: #efefed; border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; }
.bar-pct { font-size: 11px; font-weight: 700; color: #fff; }
.bar-v { background: #2176d9; } .bar-r { background: #1a9e6e; } .bar-t { background: #4a8f1a; }
.bar-note { font-size: 11px; color: #bbb; text-align: right; margin-top: 3px; }
.goal-banner { border-radius: 12px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; background: #f4f4f2; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.goal-banner.done { background: #eaf5e3; border-color: #7ec85a; }
.goal-total { font-size: 28px; font-weight: 700; }
.goal-lbl { font-size: 12px; color: #888; margin-bottom: 2px; }
.badge-ok { font-size: 12px; font-weight: 600; padding: 5px 14px; border-radius: 99px; background: #1a9e6e; color: #fff; }
.badge-pend { font-size: 12px; color: #aaa; }
.chart-label { font-size: 11px; font-weight: 700; color: #888; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
.chart-wrap { position: relative; width: 100%; height: 160px; }
.card-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
.irow { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
.fg { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 110px; }
.fg label { font-size: 11px; color: #888; }
input[type=number], input[type=text] { width: 100%; padding: 9px 10px; font-size: 14px; font-weight: 500; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #1a1a18; }
input:focus { outline: none; border-color: #2176d9; box-shadow: 0 0 0 3px #2176d922; }
.com-in { border-color: #c8860a !important; background: #fffaf2 !important; color: #7a4f00 !important; }
.btn { padding: 9px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #1a1a18; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:active { transform: scale(0.97); }
.btn-v { border-color: #1a5fa8; color: #1a5fa8; background: #f0f6ff; }
.btn-r { border-color: #0d7a56; color: #0d7a56; background: #f0fdf8; }
.btn-save { border-color: #4a8f1a; color: #4a8f1a; background: #f2faea; }
.btn-block { width: 100%; margin-top: 8px; font-size: 12px; color: #e04040; border-color: #e04040; background: #fff5f5; }
.divider { border: none; border-top: 1px solid #f0f0ee; margin: 12px 0; }
.com-note { font-size: 11px; color: #a06010; background: #fffaf2; border: 1px solid #f5d090; border-radius: 8px; padding: 7px 10px; margin-top: 8px; }
.recluta-list { display: flex; flex-direction: column; gap: 8px; }
.ri { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; background: #f9f9f7; border: 1px solid #eee; border-radius: 8px; }
.ri-name { font-size: 14px; font-weight: 600; } .ri-date { font-size: 11px; color: #aaa; margin-top: 1px; }
.ri-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 20px; line-height: 1; padding: 0 3px; }
.ri-del:hover { color: #e04040; }
.empty { font-size: 13px; color: #ccc; text-align: center; padding: 16px 0; }
.log-wrap { font-size: 12px; color: #aaa; line-height: 1.9; max-height: 70px; overflow-y: auto; }
.queue-badge { display: inline-block; background: #fff3cd; border: 1px solid #f5d090; color: #7a4f00; font-size: 11px; padding: 2px 8px; border-radius: 6px; margin-left: 8px; }
@media (prefers-color-scheme: dark) {
  body { background: #181816; color: #f0ede8; }
  .met, .bars-card, .card, .chart-card, .goal-banner { background: #242422; border-color: #333; }
  .met-label, .bar-count, .goal-lbl, .bar-note, .subtitle, .chart-label { color: #888; }
  .met-val, .card-title { color: #f0ede8; }
  .bar-bg { background: #333; }
  .goal-banner { background: #242422; border-color: #333; }
  .goal-banner.done { background: #142e0a; border-color: #3d7a22; }
  input { background: #2c2c2a !important; border-color: #3a3a38 !important; color: #f0ede8 !important; }
  .com-in { background: #2e2208 !important; border-color: #7a4f00 !important; color: #f5d090 !important; }
  .btn { background: #2c2c2a; border-color: #3a3a38; color: #f0ede8; }
  .btn-v { background: #0d1e36; border-color: #1a5fa8; color: #85b7eb; }
  .btn-r { background: #0a2318; border-color: #0d7a56; color: #5dcaa5; }
  .btn-save { background: #162308; border-color: #4a8f1a; color: #97c459; }
  .btn-block { background: #2a1010; border-color: #e04040; color: #f09595; }
  .com-note { background: #2e2208; border-color: #7a4f00; color: #f5d090; }
  .ri { background: #1e1e1c; border-color: #333; }
  .ri-name { color: #f0ede8; }
  .divider { border-color: #333; }
}
</style>
</head>
<body>

<h1>Tracker $100K</h1>
<p class="subtitle"><span class="sdot" id="sdot"></span><span id="sstatus">Iniciando...</span></p>

<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxzCSK-i76AggCSiMhsFL3kWHpRWR8gb4FjlJXBuM_egCXlgULxJGI81Mx8onLSYa88/exec';
const LS = 'tk100k_v3';

let state = { ventas: [], reclutas: [], comV: 1800, meta: 100000 };
let queue = [];
let chart = null;
let syncing = false;

function fmt(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
function todayStr() { return new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); }

function setStatus(type, msg) {
  const dot = document.getElementById('sdot');
  const s = document.getElementById('sstatus');
  if (!dot || !s) return;
  dot.className = 'sdot ' + type;
  s.textContent = msg;
}

function saveLocal() {
  try { localStorage.setItem(LS, JSON.stringify({state, queue})); } catch(e){}
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS);
    if (raw) {
      const p = JSON.parse(raw);
      state = p.state || state;
      queue = p.queue || [];
    }
  } catch(e){}
}

async function syncToSheets() {
  if (syncing || queue.length === 0) return;
  syncing = true;
  setStatus('sync', 'Sincronizando...');
  while (queue.length > 0) {
    const item = queue[0];
    try {
      await fetch(API, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(item)
      });
      queue.shift();
      saveLocal();
    } catch(e) {
      break;
    }
  }
  syncing = false;
  if (queue.length === 0) {
    setStatus('ok', 'Guardado en Google Sheets · ' + new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}));
  } else {
    setStatus('err', 'Sin internet — se guarda cuando tengas conexion (' + queue.length + ' pendientes)');
  }
}

function enqueue(payload) {
  queue.push(payload);
  saveLocal();
  syncToSheets();
}

async function loadFromSheets() {
  try {
    setStatus('sync', 'Cargando desde Google Sheets...');
    const r = await fetch(API + '?t=' + Date.now());
    const d = await r.json();
    if (d.ok) {
      state.ventas = d.ventas || [];
      state.reclutas = d.reclutas || [];
      state.comV = d.comV || state.comV;
      state.meta = d.meta || state.meta;
      queue = [];
      saveLocal();
      setStatus('ok', 'Datos cargados de Google Sheets');
      return true;
    }
  } catch(e) {}
  setStatus('err', 'Sin conexion — usando datos locales');
  return false;
}

function render() {
  const { ventas, reclutas, comV, meta } = state;
  const totalV = ventas.reduce((s,v) => s + (Number(v.monto)||0), 0);
  const numV = ventas.length;
  const numR = reclutas.length;
  const pctV = Math.min(Math.round((numV/50)*100),100);
  const pctR = Math.min(Math.round((numR/50)*100),100);
  const pctT = Math.min(Math.round((totalV/meta)*100),100);
  const faltan = Math.max(meta - totalV, 0);
  const qLen = queue.length;

  document.getElementById('app').innerHTML = `
    <div class="metrics">
      <div class="met"><div class="met-label">Ventas cerradas</div><div class="met-val blue">${numV}</div><div class="met-sub">meta: 50</div></div>
      <div class="met"><div class="met-label">Reclutas</div><div class="met-val teal">${numR}</div><div class="met-sub">meta: 50</div></div>
      <div class="met"><div class="met-label">Total ganado</div><div class="met-val green">${fmt(totalV)}</div><div class="met-sub">en ventas</div></div>
      <div class="met"><div class="met-label">Faltan</div><div class="met-val">${fmt(faltan)}</div><div class="met-sub">para la meta</div></div>
    </div>

    <div class="bars-card">
      <div class="bar-row">
        <div class="bar-header"><span class="bar-title">Ventas</span><span class="bar-count">${numV} / 50</span></div>
        <div class="bar-bg"><div class="bar-fill bar-v" style="width:${pctV}%"><span class="bar-pct">${pctV>12?pctV+'%':''}</span></div></div>
        <div class="bar-note">${numV<50?'Faltan '+(50-numV)+' ventas':'Meta de ventas completa!'}</div>
      </div>
      <div class="bar-row">
        <div class="bar-header"><span class="bar-title">Reclutas</span><span class="bar-count">${numR} / 50</span></div>
        <div class="bar-bg"><div class="bar-fill bar-r" style="width:${pctR}%"><span class="bar-pct">${pctR>12?pctR+'%':''}</span></div></div>
        <div class="bar-note">${numR<50?'Faltan '+(50-numR)+' reclutas':'Meta de reclutas completa!'}</div>
      </div>
      <div class="bar-row">
        <div class="bar-header"><span class="bar-title">Meta dinero ${fmt(meta)}</span><span class="bar-count">${fmt(totalV)}</span></div>
        <div class="bar-bg"><div class="bar-fill bar-t" style="width:${pctT}%"><span class="bar-pct">${pctT>12?pctT+'%':''}</span></div></div>
        <div class="bar-note">${faltan>0?'Faltan '+fmt(faltan):'Meta alcanzada!'}</div>
      </div>
    </div>

    <div class="goal-banner ${totalV>=meta?'done':''}">
      <div>
        <div class="goal-lbl">Total acumulado${qLen>0?'<span class="queue-badge">'+qLen+' por sincronizar</span>':''}</div>
        <div class="goal-total">${fmt(totalV)}</div>
      </div>
      <div>${totalV>=meta?'<span class="badge-ok">Meta alcanzada!</span>':'<span class="badge-pend">'+pctT+'% completado</span>'}</div>
    </div>

    <div class="chart-card">
      <div class="chart-label">Ventas por mes</div>
      <div class="chart-wrap"><canvas id="chartV" role="img" aria-label="Ventas por mes"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title">Comision por venta</div>
      <div class="irow">
        <div class="fg"><label>Comision base ($)</label><input type="number" class="com-in" id="comV" value="${comV}" min="1" step="1"></div>
        <div class="fg"><label>Meta total ($)</label><input type="number" class="com-in" id="metaT" value="${meta}" min="1" step="1000"></div>
        <button class="btn btn-save" onclick="guardarConfig()">Guardar</button>
      </div>
      <div class="com-note">Comision base: ${fmt(comV)} · Meta: ${fmt(meta)} · Necesitas ~${Math.ceil(meta/comV)} ventas</div>
    </div>

    <div class="card">
      <div class="card-title">+ Registrar venta</div>
      <div class="irow">
        <div class="fg"><label>Cantidad</label><input type="number" id="addV" value="1" min="1" step="1"></div>
        <div class="fg"><label>Comision real ($) — opcional</label><input type="number" id="addVamt" placeholder="Vacio = usa base"></div>
        <button class="btn btn-v" onclick="addVenta()">+ Venta</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">+ Agregar recluta</div>
      <div class="irow">
        <div class="fg"><label>Nombre</label><input type="text" id="addRnom" placeholder="Nombre completo"></div>
        <button class="btn btn-r" onclick="addRecluta()">+ Recluta</button>
      </div>
      <hr class="divider">
      <div class="card-title" style="margin-bottom:10px;">Lista de reclutas (${numR}/50)</div>
      <div class="recluta-list">
        ${reclutas.length===0
          ? '<div class="empty">Aun no hay reclutas</div>'
          : reclutas.map((r,i)=>`
            <div class="ri">
              <div><div class="ri-name">${r.nombre}</div><div class="ri-date">${r.fecha}</div></div>
              <button class="ri-del" onclick="delRecluta(${i},'${r.nombre.replace(/'/g,"\\'")}')">×</button>
            </div>`).join('')}
      </div>
      <button class="btn btn-block" onclick="resetAll()">↺ Reiniciar todo</button>
    </div>
  `;

  drawChart(ventas);
}

function drawChart(ventas) {
  const byMonth = {};
  ventas.forEach(v => {
    const d = new Date(v.fecha);
    const key = isNaN(d.getTime()) ? todayStr() : d.toLocaleDateString('es-MX',{month:'short',year:'2-digit'});
    byMonth[key] = (byMonth[key]||0) + (Number(v.monto)||0);
  });
  const labels = Object.keys(byMonth);
  const data = labels.map(k=>byMonth[k]);
  if (labels.length===0) { labels.push('Sin datos'); data.push(0); }
  const ctx = document.getElementById('chartV');
  if (!ctx) return;
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets:[{label:'Ventas',data,backgroundColor:'#2176d933',borderColor:'#2176d9',borderWidth:2,borderRadius:6}] },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw)}}},
      scales:{
        y:{beginAtZero:true,ticks:{callback:v=>fmt(v),font:{size:10}},grid:{color:'#e8e8e811'}},
        x:{ticks:{font:{size:10}},grid:{display:false}}
      }
    }
  });
}

function addVenta() {
  const n = parseInt(document.getElementById('addV').value)||1;
  const custom = parseFloat(document.getElementById('addVamt').value);
  const comV = parseFloat(document.getElementById('comV').value)||state.comV;
  const montoUnit = isNaN(custom) ? comV : custom;
  const fecha = todayStr();
  for (let i=0;i<n;i++) {
    state.ventas.push({fecha, monto: montoUnit});
    enqueue({action:'addVenta', fecha, monto: montoUnit, nota:''});
  }
  document.getElementById('addVamt').value = '';
  saveLocal(); render();
}

function addRecluta() {
  const nombre = document.getElementById('addRnom').value.trim() || ('Recluta #'+(state.reclutas.length+1));
  const fecha = todayStr();
  state.reclutas.push({nombre, fecha});
  enqueue({action:'addRecluta', nombre, fecha});
  document.getElementById('addRnom').value = '';
  saveLocal(); render();
}

function delRecluta(i, nombre) {
  state.reclutas.splice(i,1);
  enqueue({action:'delRecluta', nombre});
  saveLocal(); render();
}

function guardarConfig() {
  state.comV = parseFloat(document.getElementById('comV').value)||1800;
  state.meta  = parseFloat(document.getElementById('metaT').value)||100000;
  enqueue({action:'saveConfig', comV:state.comV, meta:state.meta});
  saveLocal(); render();
}

function resetAll() {
  if (!confirm('Esto borra TODO. Estas seguro?')) return;
  state.ventas = []; state.reclutas = [];
  enqueue({action:'reset'});
  saveLocal(); render();
}

async function init() {
  loadLocal();
  render();
  setStatus('sync', 'Cargando desde Google Sheets...');
  const ok = await loadFromSheets();
  if (ok) render();
  if (queue.length > 0) syncToSheets();
}

init();
</script>
</body>
</html>
